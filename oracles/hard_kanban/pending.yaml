  - id: PD-C1
    question: "Um cinza levemente tingido (ex.: cinza-azulado claro, 226,232,240) conta como 'cinza'? (piloto 1, H-A-01)"
    rule: 1
    options: ["sim, cinza tingido é cinza", "não, só cinza neutro"]
    status: decided
    decision: "Sim (decisão do pesquisador). Conta como cinza quem tem saturação HSL < 0,15 OU croma (máx − mín) ≤ 6 % da escala (GRAY_MAX_CHROMA em common/colors.py). Vale para todas as tarefas."
    decided_on: "2026-10-09"
    blocks: [H-A-01]
  - id: PD-C2
    question: "Cores perto do limite entre duas faixas de matiz (ex.: vermelho-rosado a 344° com o vermelho começando em 345°; lilás a 249° com o roxo começando em 251°) contam como a cor pedida? (piloto 1, H-A-03/05/08/10)"
    rule: 1
    options: ["margem nos limites", "faixas exatas"]
    status: decided
    decision: "Margem de ±5° nos limites das faixas (HUE_TOLERANCE, hue_matches em common/colors.py), nos testes de nível A de todas as tarefas. Cinza nunca vira cor pela margem; laranja-âmbar (36°) continua não sendo amarelo; quase branco (250,245,255) continua não sendo roxo."
    decided_on: "2026-10-09"
    blocks: [H-A-01, H-A-03, H-A-05, H-A-08, H-A-10]
  - id: PD-C3
    question: "Quando uma ação do usuário funciona mas o efeito esperado não aparece (app inerte), o caso vale PARTIAL ou NO? O que é pontuado: a ação, a pré-condição ou só o resultado?"
    rule: 2
    options: ["só o resultado esperado pontua; o efeito principal é pré-condição", "ação e pré-condição também pontuam"]
    status: decided
    decision: "Só o Expected Result pontua (WebGen-Bench). Ações (act) e pré-condições (require) que dão certo são passos e não pontuam; o EFEITO PRINCIPAL do caso é pré-condição (require) dos invariantes: se ele não acontece o caso é NO, não PARTIAL. Invariantes que passam com o app inerte (formato, ausência de erro, 'o card só existe uma vez') continuam como ok, mas só valem depois do efeito. Casos com mais de um requisito independente (E-A-01, M-A-05, H-A-03) seguem podendo dar PARTIAL."
    decided_on: "2026-10-10"
    blocks: [H-A-04, H-A-06, H-A-11, H-A-14]
  - id: PD-H6
    question: "O corpo de 'Aprovado' (#C5CC9E na spec, matiz ~70°) cai na faixa do amarelo, não na do verde. O nível A ('derivado só do prompt') compara o matiz do corpo com a cor pedida?"
    rule: 3
    options: ["só luminância no Aprovado", "matiz nas quatro colunas", "luminância nas quatro colunas"]
    status: decided
    decision: "O prompt pede 'cor mais fraca' da respectiva cor (verde para Aprovado); o hex da spec (#C5CC9E) é amarelado e é exigência da spec (nível B, H-B-02). No nível A, o corpo de 'Aprovado' é comparado SÓ pela luminância (mais claro que o cabeçalho); o matiz do corpo é comparado nas outras três colunas, onde o hex da spec não contradiz o nome da cor. A isenção vale igual para no_spec e with_spec (decisão do pesquisador, revisão D6)."
    decided_on: "2026-10-10"
    blocks: [H-A-03]
