<!doctype html><meta charset="utf-8"><title>fixture: widgets de timer</title>
<body style="margin:0;font-family:sans-serif"><app-root>
<header style="height:70px;background:#E56060;display:flex;align-items:center;gap:8px;color:#fff;padding:0 24px">
  <svg width="32" height="32" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#fff"/></svg><span>Pomodoro</span>
</header>
<main style="text-align:center">
  <div style="width:503px;height:503px;border:6px solid rgb(215,71,71);border-radius:50%;margin:20px auto">
    <div style="font-size:36px">Foco Total</div>
    <div style="font-size:128px">25:00</div>
    <button type="button" aria-label="__BUTTON_NAME__" style="border-radius:50%;width:60px;height:60px"><svg width="20" height="20"><path d="M0 0L20 10L0 20z"/></svg></button>
  </div>
  <hr style="border-color:#716C6C">
  <div style="display:flex;justify-content:space-between;padding:0 24px">
    <label>Foco Total <input type="number" value="25" style="width:80px"></label>
    <label>Pausa Curta <input type="text" value="05:00" style="width:80px"></label>
    <label>Pausa Longa <input type="number" value="15" style="width:80px"></label>
  </div>
</main></app-root></body>
