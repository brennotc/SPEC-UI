<!doctype html><meta charset="utf-8"><title>fixture: colunas e cards</title>
<body style="margin:0;background:#D7CFCF;font-family:sans-serif"><app-root>
<header style="height:70px;background:#105610;color:#fff;display:flex;align-items:center;padding:0 24px"><span>Kanban</span></header>
<div style="display:flex;gap:16px;padding:16px">
  <section style="flex:1;background:#9EBACC"><h2 style="margin:0;background:#0B73B7;color:#fff;text-align:center">Para Fazer</h2>
    <article style="margin:12px;height:120px;background:#D7CFCF;position:relative"><span style="position:absolute;right:8px;top:4px"><button aria-label="Editar card" style="color:#0B73B7">E</button><button aria-label="Excluir card" style="color:#B50000">X</button></span><p style="text-align:center;padding-top:40px">Card A</p></article>
    <div style="margin:12px;height:120px;border:2px dashed #656060;opacity:.7;display:flex;align-items:center;justify-content:center"><span style="color:#656060">+</span></div>
  </section>
  <section style="flex:1;background:#CCB59E"><h2 style="margin:0;background:#B77A0B;color:#fff;text-align:center">Em Progresso</h2>
    <article style="margin:12px;height:120px;background:#D7CFCF"><div style="text-align:right"><svg width="16" height="16"><rect width="16" height="16" fill="#0B73B7"/></svg><svg width="16" height="16"><rect width="16" height="16" fill="#B50000"/></svg></div><p style="text-align:center;padding-top:30px">Card B</p></article></section>
  <section style="flex:1;background:#AA9ECC"><h2 style="margin:0;background:#440BB7;color:#fff;text-align:center">Feito</h2></section>
  <section style="flex:1;background:#C5CC9E"><h2 style="margin:0;background:#105610;color:#fff;text-align:center">Aprovado</h2></section>
</div></app-root></body>
